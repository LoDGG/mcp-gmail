[project]
name = "gmail-agent-fake-mcp"
version = "0.1.0"
description = "Provider-neutral agentic Gmail prototype with a fake MCP backend"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "google-genai>=1,<2",
    "jsonschema>=4,<5",
    "mcp>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_gmail_mcp", "src/gmail_agent", "src/real_gmail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
