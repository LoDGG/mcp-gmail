[project]
name = "gmail-agent-fake-mcp"
version = "0.1.0"
description = "Deterministic fake email MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_gmail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
